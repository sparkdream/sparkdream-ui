---
version: "2.0"

services:
  web:
    image: sparkdreamnft/sparkdream-ui:v1.0.0
    expose:
      - port: 3000
        as: 80
        accept:
          - app-test.sparkdream.io
        to:
          - global: true
    env:
      # Runtime config — read by /api/config and the LCD proxy at request time,
      # so denom/endpoint changes only need a deployment update, not a rebuild.
      # The NEXT_PUBLIC_* variants are inlined at build time and would not pick
      # up edits made here, so they are intentionally not used in the SDL.
      - CHAIN_ID=sparkdream-test-1
      - LCD_ENDPOINT=https://api-test.sparkdream.io
      - RPC_ENDPOINT=https://rpc-test.sparkdream.io
      - CHAIN_DENOM=uspark.sparkdreamtest
      - DISPLAY_DENOM=SPARK
      # Ticker of the internal DREAM token. Launcher-deployed fleets get this
      # rendered from the launch spec (token.dreamDisplayDenom, the same field
      # that seeds x/identity); set it by hand for a manual deploy.
      - DREAM_DISPLAY_DENOM=DREAM
      - BECH32_PREFIX=sprkdrm
      - CHAIN_NAME=Spark Dream
      # Optional: point at a manifests.json hosted in object storage
      # (4everland / R2 / S3) so new snapshots become visible by uploading
      # files — no redeploy. Set after running `npm run snapshot:upload`.
      # The bucket must CORS-allow this deployment's hostname — see
      # deploy/s3-cors.json for a sample policy.
      # - REMOTE_MANIFEST_URL=https://my-bucket.4everbucket.com/manifests.json
      # Anonymous prover: the image serves each chain release's prover from
      # public/zk/<version>/ (or set ZK_ASSETS_URL to a bucket). Pin the
      # release and its files' sha256 (the "files" of that release's
      # manifest.json, from the chain repo's prepare-release.sh) so a tampered
      # directory is refused; unpinned, the node's version picks the release
      # and its own manifest is trusted.
      # - ZK_VERSION=v1.0.53
      # - 'ZK_DIGESTS={"shield.wasm":"<sha256>","wasm_exec.js":"<sha256>","proving_key.raw.bin":"<sha256>","circuit.r1cs":"<sha256>"}'

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    dcloud:
      pricing:
        web:
          denom: uact
          amount: 1000

deployment:
  web:
    dcloud:
      profile: web
      count: 1
